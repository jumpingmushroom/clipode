# A version tag (v0.1.0) runs the checks, builds each target on a runner of its own platform (macOS binaries on a Mac,
# so they carry a valid signature), starts each binary once, and publishes the gzipped binaries with SHA256SUMS.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json
        run: test "${GITHUB_REF_NAME}" = "v$(bun -e 'console.log(require("./package.json").version)')"
      - run: bun run typecheck
      - run: bun test

  build:
    needs: check
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-13
          - target: darwin-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run build --target=${{ matrix.target }}
      - name: Start the binary once
        run: ./dist/clipode-${{ matrix.target }}/clipode --version
      - uses: actions/upload-artifact@v4
        with:
          name: clipode-${{ matrix.target }}
          path: |
            dist/clipode-${{ matrix.target }}.gz
            dist/SHA256SUMS

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries and checksums
        run: |
          mkdir release
          cp artifacts/*/clipode-*.gz release/
          cat artifacts/*/SHA256SUMS | sort -k2 > release/SHA256SUMS
          cd release && sha256sum -c SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "clipode $GITHUB_REF_NAME" --generate-notes release/*
